name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v2026.11.03 or v2026.11.03-rc1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: source
        name: Resolve the tagged source once for both platforms
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: python
        run: |
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9][A-Za-z0-9._+-]{0,99}', tag):
              raise SystemExit('Use a version tag beginning with v and a digit, without slashes or spaces.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ncommit={commit}\n')

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            binary_dir: build/release/Release
          - os: ubuntu-22.04
            platform: linux-x64
            binary_dir: build/release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux game dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libmpg123-dev
      - name: Configure Windows Release with static compiler runtime
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DWEB_EDITION=both -DWEB_BUILD_GAMES=ON -DBUILD_TESTING=ON
          -DWEB_ASSET_TESTS=OFF -DWEB_REFERENCE_TOOLS=OFF -DWEB_DESKTOP_TESTS=OFF
      - name: Configure Linux Release
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DWEB_EDITION=both -DWEB_BUILD_GAMES=ON -DBUILD_TESTING=ON
          -DWEB_ASSET_TESTS=OFF -DWEB_REFERENCE_TOOLS=OFF -DWEB_DESKTOP_TESTS=OFF
      - run: cmake --build build/release --config Release --parallel 2
      - run: ctest --test-dir build/release -C Release --output-on-failure --no-tests=error
      - name: Test release packaging
        run: python tools/test-release.py
      - name: Package and smoke-test both shipping games without media
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_BINARIES: ${{ matrix.binary_dir }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tools/package-release.py',
              '--build-dir', os.environ['RELEASE_BINARIES'],
              '--platform', os.environ['RELEASE_PLATFORM'],
              '--tag', os.environ['RELEASE_TAG'],
              '--commit', os.environ['RELEASE_COMMIT']], check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [source, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Ensure the remote tag still identifies the tested source
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
      - name: Verify downloads and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python tools/publish-release.py
