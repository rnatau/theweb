name: Portable validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - {os: macos-15, compiler: clang++, sanitize: 'OFF'}
          - {os: macos-15-intel, compiler: clang++, sanitize: 'OFF'}
          - {os: windows-latest, compiler: msvc, sanitize: 'OFF'}
          - {os: ubuntu-latest, compiler: g++, sanitize: 'OFF'}
          - {os: ubuntu-latest, compiler: clang++, sanitize: 'ON'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: cmake -S . -B build/tests -DWEB_BUILD_GAMES=OFF -DWEB_ASSET_TESTS=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWEB_SANITIZERS=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=Debug
      - if: runner.os == 'macOS'
        run: |
          brew install sdl2 mpg123
          cmake -S . -B build/tests -DWEB_BUILD_GAMES=ON -DWEB_ASSET_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug
      - if: runner.os == 'Windows'
        run: cmake -S . -B build/tests -DWEB_BUILD_GAMES=ON -DWEB_ASSET_TESTS=OFF
      - run: cmake --build build/tests --config Debug --parallel 2
      - run: ctest --test-dir build/tests -C Debug --output-on-failure --no-tests=error
      - if: runner.os == 'macOS'
        run: |
          build/tests/theweb --help
          build/tests/theweb-enhanced --version
      - run: python tools/test-release.py
      - run: python -m pip install clang-format==23.1.3
      - shell: python
        run: |
          from pathlib import Path
          import subprocess
          files = [str(p) for p in Path('native').rglob('*') if p.suffix in {'.cpp', '.hpp'}]
          subprocess.run(['clang-format', '--style=file', '--dry-run', '--Werror', *files], check=True)
